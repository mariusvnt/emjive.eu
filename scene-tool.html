<!--
  Dev-only page (not built), served by scripts/scene-tool-server.js
  (npm run scene-tool): preview a product or the swatch scene under a chosen
  HDRI and metal, set the camera by dragging or typing, tune the HDRI blur,
  the sun, the reflection detail and the metal's shader live, then save the
  ticked parts (HDRI, camera, blur, detail, sun, shader). The blur, the sun and
  the detail are the same in every scene, in both modes. The swatch scene's own
  settings are its HDRI, an extra blur and camera angles; distance and frame
  are solved. A dial overlay shows what the material dial cuts from it.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>em·ji·ve: scene tool</title>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
<script src="js/helpers.js"></script>
<script src="js/option-dial.js"></script>
<script type="module" src="js/three-viewer.js"></script>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 -apple-system, "Segoe UI", sans-serif;
    display: flex;
    min-height: 100vh;
  }
  h1 { font-size: 16px; margin: 0 0 4px; }
  h2 { font-size: 13px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.7; }
  .layout { display: flex; width: 100%; }
  .controls {
    width: 340px;
    flex: none;
    padding: 16px;
    overflow-y: auto;
    border-right: 1px solid rgba(128,128,128,0.3);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .controls section { display: flex; flex-direction: column; gap: 6px; }
  .controls label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  /* [hidden] loses to the display rules above. */
  .controls section[hidden], .controls label[hidden] { display: none; }
  select, input[type="number"], input[type="color"] { font: inherit; padding: 4px 6px; }
  .metal-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
  .metal-buttons button {
    font: inherit;
    padding: 5px 12px;
    border: 1px solid rgba(128,128,128,0.5);
    border-radius: 999px;
    background: transparent;
    cursor: pointer;
  }
  .metal-buttons button.is-selected { background: rgba(128,128,128,0.35); font-weight: 600; }
  .readout { display: flex; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }
  .readout .orbit-field { display: flex; align-items: center; gap: 4px; }
  .readout .orbit-field input { width: 56px; }
  .angle-row { display: flex; align-items: center; gap: 8px; }
  .angle-row[hidden] { display: none; }
  .angle-row > span:first-child { width: 4.5em; }
  .angle-row input[type="range"] { flex: 1; min-width: 0; }
  .angle-row input[type="number"] { width: 64px; }
  .slider-row { display: flex; align-items: center; gap: 8px; }
  .slider-row input[type="range"] { flex: 1; }
  .slider-row output { width: 3.5em; text-align: right; font-variant-numeric: tabular-nums; }
  button { cursor: pointer; }
  .controls label.check-row { flex-direction: row; align-items: center; gap: 6px; }
  #saveSection { gap: 8px; }
  #saveSection label { flex-direction: row; align-items: center; gap: 6px; }
  #saveBtn { align-self: flex-start; padding: 6px 16px; font-weight: 600; }
  #copyJsonBtn { align-self: flex-start; }
  .save-result { font-size: 13px; padding: 2px 0; }
  .save-result--ok { color: #2a8f4d; }
  .save-result--fail { color: #c0392b; }
  .viewer-stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px;
  }
  #viewerContainer {
    width: 520px;
    height: 520px;
    max-width: 100%;
    border: 1px solid rgba(128,128,128,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
  }
  #viewerContainer .emjive-3d-viewer { width: 100%; height: 100%; }
  /* Swatch mode: the swatch's own square frame (what auto-render saves), 360px.
     The viewer is absolutely placed since a percentage height won't resolve
     against an aspect-ratio box. Not draggable: the fields set the camera. */
  #viewerContainer.is-swatch {
    display: block;
    position: relative;
    width: 360px;
    max-width: 100%;
    aspect-ratio: 1 / 1;
    height: auto;
    padding: 0;
  }
  #viewerContainer.is-swatch .emjive-3d-viewer { position: absolute; inset: 0; pointer-events: none; }
  .dial-overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #statusMessage { font-size: 13px; opacity: 0.75; min-height: 1.2em; }

  /* The .emjive-3d-viewer rules this page needs (it doesn't load css/style.css). */
  .emjive-3d-viewer { position: relative; touch-action: none; cursor: grab; }
  .emjive-3d-viewer__canvas { display: block; width: 100%; height: 100%; }
  .emjive-3d-viewer__poster {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transition: opacity 0.3s ease;
  }
</style>
</head>
<body>
<div class="layout">
  <div class="controls">
    <section>
      <h1>Scene tool</h1>
    </section>

    <section id="hdriSection">
      <label>HDRI
        <select id="hdriSelect"></select>
      </label>
      <div class="angle-row">
        <span>Blur</span>
        <input type="range" id="hdriBlurSlider" min="0" max="10" step="0.1">
        <input type="number" id="hdriBlurInput" min="0" step="0.1"><span>&deg;</span>
      </div>
      <div class="angle-row">
        <span>Detail</span>
        <input type="range" id="detailSlider" min="0" max="4" step="0.25">
        <input type="number" id="detailInput" min="0" step="0.25"><span>levels</span>
      </div>
      <div class="angle-row" id="blurRow" hidden>
        <span>Swatch blur</span>
        <input type="range" id="blurSlider" min="0" max="30" step="0.5">
        <input type="number" id="blurInput" min="0" step="0.5"><span>px</span>
      </div>
    </section>

    <section id="sunSection">
      <h2>Sun</h2>
      <label class="check-row"><input type="checkbox" id="sunOnInput"> On</label>
      <div class="angle-row">
        <span>Strength</span>
        <input type="range" id="sunStrengthSlider" min="0" max="40" step="0.5">
        <input type="number" id="sunStrengthInput" min="0" step="0.5">
      </div>
    </section>

    <section>
      <label>Model
        <select id="modelSelect"></select>
      </label>
      <label class="check-row" id="dialOverlayRow" hidden><input type="checkbox" id="dialOverlayInput" checked> Dial overlay</label>
    </section>

    <section>
      <label>Metal</label>
      <div class="metal-buttons" id="metalButtons"></div>
    </section>

    <section id="cameraSection">
      <h2>Camera</h2>
      <div class="angle-row">
        <span>Rotation</span>
        <input type="range" id="rotationSlider" min="-180" max="180" step="1">
        <input type="number" id="rotationInput" step="1"><span>&deg;</span>
      </div>
      <div class="angle-row">
        <span>Tilt</span>
        <input type="range" id="tiltSlider" min="0" max="180" step="1">
        <input type="number" id="tiltInput" step="1"><span>&deg;</span>
      </div>
      <div class="angle-row">
        <span>Roll</span>
        <input type="range" id="rollSlider" min="-180" max="180" step="1">
        <input type="number" id="rollInput" step="1"><span>&deg;</span>
      </div>
      <div class="readout" id="zoomRow">
        <span class="orbit-field">Zoom: <input type="number" id="zoomInput" step="any"> %</span>
      </div>
      <button type="button" id="resetCameraBtn">Reset to saved default</button>
    </section>

    <section id="shaderSection">
      <h2>Metal shader — <span id="shaderMetalLabel"></span></h2>
      <label>Color
        <input type="color" id="colorInput">
      </label>
      <label>Metalness
        <div class="slider-row">
          <input type="range" id="metalnessInput" min="0" max="1" step="0.01">
          <output id="metalnessReadout"></output>
        </div>
      </label>
      <label>Roughness
        <div class="slider-row">
          <input type="range" id="roughnessInput" min="0" max="1" step="0.01">
          <output id="roughnessReadout"></output>
        </div>
      </label>
    </section>

    <section id="saveSection">
      <h2>Save</h2>
      <label id="saveHdriLabel"><input type="checkbox" id="saveHdri"> HDRI</label>
      <label><input type="checkbox" id="saveCamera"> <span id="saveCameraLabel">Camera</span></label>
      <label><input type="checkbox" id="saveHdriBlur"> Blur</label>
      <label><input type="checkbox" id="saveDetail"> Reflection detail</label>
      <label><input type="checkbox" id="saveSun"> Sun</label>
      <label><input type="checkbox" id="saveShader"> Metal shader</label>
      <div>
        <button type="button" id="saveBtn">Save</button>
        <button type="button" id="copyJsonBtn">Copy JSON</button>
      </div>
      <div id="saveResults"></div>
    </section>
  </div>

  <div class="viewer-stage">
    <div id="viewerContainer"></div>
    <div id="statusMessage"></div>
  </div>
</div>

<script type="module">
import * as THREE from "three";

const { requestJson } = window.EmjiveHelpers;

// As in js/three-viewer.js, for readCurrentOrbit().
const WORLD_UP = new THREE.Vector3(0, 1, 0);

const state = {
  seriesIndex: null,
  productsBySeriesSlug: {},
  mode: null, // "product" | "swatch"
  seriesSlug: null,
  product: null,
  swatchCamera: null, // swatch camera angles: { rotation, tilt, roll }
  swatchBlur: null, // swatch HDRI blur, px of the HDRI image
  metal: null,
  handle: null,
  lastOrbit: null,
  buildToken: 0
};

const els = {};
[
  "hdriSelect", "modelSelect", "metalButtons", "viewerContainer", "statusMessage",
  "rotationInput", "tiltInput", "zoomInput", "rollInput", "rotationSlider", "tiltSlider", "rollSlider", "zoomRow", "blurRow", "blurSlider", "blurInput",
  "resetCameraBtn", "saveCameraLabel",
  "colorInput", "metalnessInput", "roughnessInput", "metalnessReadout", "roughnessReadout",
  "shaderMetalLabel", "saveHdri", "saveCamera", "saveShader", "saveBtn", "copyJsonBtn", "saveResults",
  "sunOnInput", "sunStrengthSlider", "sunStrengthInput", "saveSun", "hdriBlurSlider", "hdriBlurInput", "saveHdriBlur",
  "detailSlider", "detailInput", "saveDetail", "dialOverlayRow", "dialOverlayInput"
].forEach((id) => { els[id] = document.getElementById(id); });

init().catch((err) => {
  console.error(err);
  els.statusMessage.textContent = "Failed to load: " + err.message;
});

async function init() {
  state.seriesIndex = await requestJson("data/series.json");
  state.seriesIndex["metal-shaders"] = state.seriesIndex["metal-shaders"] || {};
  window.EmjiveModelViewer.setMetalShaders(state.seriesIndex["metal-shaders"]);
  state.seriesIndex.sun = state.seriesIndex.sun || { on: true, strength: 12 };
  window.EmjiveModelViewer.setSun(state.seriesIndex.sun);
  window.EmjiveModelViewer.setHdriBlur(savedHdriBlur());
  window.EmjiveModelViewer.setReflectionDetail(savedDetail());
  els.detailInput.value = savedDetail();
  els.detailSlider.value = savedDetail();
  await loadAllProducts();
  populateHdriSelect();
  populateSunControls();
  els.hdriBlurInput.value = savedHdriBlur();
  els.hdriBlurSlider.value = savedHdriBlur();
  populateModelSelect();
  populateMetalButtons();
  wireEvents();
  requestAnimationFrame(readoutLoop);
  await rebuildViewer();
}

async function loadAllProducts() {
  const seriesList = state.seriesIndex.series || [];
  for (const s of seriesList) {
    state.productsBySeriesSlug[s.slug] = await requestJson(s.products);
  }
}

function populateHdriSelect() {
  const hdris = state.seriesIndex.hdris || {};
  els.hdriSelect.innerHTML = "";
  Object.keys(hdris).forEach((key) => {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = key;
    els.hdriSelect.appendChild(opt);
  });
  const firstSeries = (state.seriesIndex.series || [])[0];
  const defaultKey = (firstSeries && firstSeries.hdri) || Object.keys(hdris)[0];
  if (defaultKey) els.hdriSelect.value = defaultKey;
}

function populateModelSelect() {
  els.modelSelect.innerHTML = "";

  const productsGroup = document.createElement("optgroup");
  productsGroup.label = "Products";
  (state.seriesIndex.series || []).forEach((s) => {
    const productsData = state.productsBySeriesSlug[s.slug];
    (productsData.products || []).forEach((p) => {
      const opt = document.createElement("option");
      opt.value = "product:" + s.slug + ":" + p.id;
      opt.textContent = s.name + " — " + p.name;
      productsGroup.appendChild(opt);
    });
  });
  if (productsGroup.children.length) els.modelSelect.appendChild(productsGroup);

  const swatchGroup = document.createElement("optgroup");
  swatchGroup.label = "Swatch";
  const swatchOpt = document.createElement("option");
  swatchOpt.value = "swatch";
  swatchOpt.textContent = "Metal swatch (sphere)";
  swatchGroup.appendChild(swatchOpt);
  els.modelSelect.appendChild(swatchGroup);

  els.modelSelect.value = productsGroup.children.length ? productsGroup.children[0].value : "swatch";
}

function populateMetalButtons() {
  const metals = state.seriesIndex.metals || [];
  els.metalButtons.innerHTML = "";
  metals.forEach((m) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = m;
    btn.dataset.metal = m;
    btn.addEventListener("click", () => onMetalButtonClick(m));
    els.metalButtons.appendChild(btn);
  });
}

function findSeries(slug) {
  return (state.seriesIndex.series || []).find((entry) => entry.slug === slug) || null;
}

function currentModelSelection() {
  const value = els.modelSelect.value;
  const parts = value.split(":");
  if (parts[0] === "product") {
    const seriesSlug = parts[1];
    const productId = parts[2];
    const productsData = state.productsBySeriesSlug[seriesSlug];
    const product = (productsData.products || []).find((p) => p.id === productId);
    return { mode: "product", seriesSlug, product };
  }
  return { mode: "swatch" };
}

function wireEvents() {
  els.hdriSelect.addEventListener("change", () => rebuildViewer());
  els.modelSelect.addEventListener("change", () => rebuildViewer());
  els.dialOverlayInput.addEventListener("change", renderDialOverlay);
  els.colorInput.addEventListener("input", onShaderInputChange);
  els.metalnessInput.addEventListener("input", onShaderInputChange);
  els.roughnessInput.addEventListener("input", onShaderInputChange);
  els.rotationInput.addEventListener("change", onOrbitInputChange);
  els.tiltInput.addEventListener("change", onOrbitInputChange);
  els.zoomInput.addEventListener("change", onOrbitInputChange);
  els.rollInput.addEventListener("change", onOrbitInputChange);
  // A blur needs a new environment: rebuild once the value settles, not per step.
  els.hdriBlurSlider.addEventListener("input", () => { els.hdriBlurInput.value = els.hdriBlurSlider.value; });
  els.hdriBlurSlider.addEventListener("change", onHdriBlurChange);
  els.hdriBlurInput.addEventListener("change", () => {
    els.hdriBlurSlider.value = els.hdriBlurInput.value;
    onHdriBlurChange();
  });
  // Live: applyMetal() makes a fresh material, no rebuild.
  els.detailSlider.addEventListener("input", () => {
    els.detailInput.value = els.detailSlider.value;
    onDetailChange();
  });
  els.detailInput.addEventListener("input", () => {
    els.detailSlider.value = els.detailInput.value;
    onDetailChange();
  });
  els.blurSlider.addEventListener("input", () => { els.blurInput.value = els.blurSlider.value; });
  els.blurSlider.addEventListener("change", onBlurChange);
  els.blurInput.addEventListener("change", () => {
    els.blurSlider.value = els.blurInput.value;
    onBlurChange();
  });
  // A slider sets its field, then follows the typed-value path.
  [["rotationSlider", "rotationInput"], ["tiltSlider", "tiltInput"], ["rollSlider", "rollInput"]].forEach(([slider, field]) => {
    els[slider].addEventListener("input", () => {
      els[field].value = els[slider].value;
      onOrbitInputChange();
    });
  });
  els.sunOnInput.addEventListener("change", onSunInputChange);
  els.sunStrengthSlider.addEventListener("input", () => {
    els.sunStrengthInput.value = els.sunStrengthSlider.value;
    onSunInputChange();
  });
  els.sunStrengthInput.addEventListener("input", () => {
    els.sunStrengthSlider.value = els.sunStrengthInput.value;
    onSunInputChange();
  });
  els.resetCameraBtn.addEventListener("click", onResetCamera);
  els.saveBtn.addEventListener("click", onSaveClick);
  els.copyJsonBtn.addEventListener("click", onCopyJsonClick);
}

// The saved swatch angles (default: straight in front, eye level), as an editable copy.
function savedSwatchCamera() {
  const saved = state.seriesIndex["swatch-camera"];
  const ok = saved && ["rotation", "tilt", "roll"].every((k) => typeof saved[k] === "number");
  return ok ? { rotation: saved.rotation, tilt: saved.tilt, roll: saved.roll } : { rotation: 0, tilt: 90, roll: 0 };
}

function savedSwatchBlur() {
  const saved = state.seriesIndex["swatch-blur"];
  return typeof saved === "number" && saved >= 0 ? saved : 0;
}

// Every scene's HDRI blur, sigma in degrees.
function savedHdriBlur() {
  const saved = state.seriesIndex["hdri-blur"];
  return typeof saved === "number" && saved >= 0 ? saved : 0;
}

function onHdriBlurChange() {
  const deg = parseFloat(els.hdriBlurInput.value);
  if (!Number.isFinite(deg) || deg < 0) return;
  window.EmjiveModelViewer.setHdriBlur(deg);
  rebuildViewer();
}

// Every metal's reflection detail: environment levels read finer.
function savedDetail() {
  const saved = state.seriesIndex["reflection-detail"];
  return typeof saved === "number" && saved >= 0 ? saved : 0;
}

function onDetailChange() {
  const levels = parseFloat(els.detailInput.value);
  if (!Number.isFinite(levels) || levels < 0) return;
  window.EmjiveModelViewer.setReflectionDetail(levels);
  if (state.handle) state.handle.applyMetal(state.metal);
}

function onBlurChange() {
  const blur = parseFloat(els.blurInput.value);
  if (!Number.isFinite(blur) || blur < 0) return;
  state.swatchBlur = blur;
  rebuildViewer();
}

function fillSwatchCameraInputs() {
  const camera = state.swatchCamera;
  els.rotationInput.value = camera.rotation;
  els.tiltInput.value = camera.tilt;
  els.rollInput.value = camera.roll;
  syncSliders();
}

// Sliders mirror their fields (clamped to their own range).
function syncSliders() {
  if (document.activeElement !== els.rotationSlider) els.rotationSlider.value = els.rotationInput.value;
  if (document.activeElement !== els.tiltSlider) els.tiltSlider.value = els.tiltInput.value;
  if (document.activeElement !== els.rollSlider) els.rollSlider.value = els.rollInput.value;
}

// The "sun" object the viewer reads (setSun in init), edited in place and
// re-read by applySun(): no rebuild.
function populateSunControls() {
  const sun = state.seriesIndex.sun;
  els.sunOnInput.checked = sun.on;
  els.sunStrengthInput.value = sun.strength;
  els.sunStrengthSlider.value = sun.strength;
  els.sunStrengthSlider.disabled = !sun.on;
  els.sunStrengthInput.disabled = !sun.on;
}

function onSunInputChange() {
  const strength = parseFloat(els.sunStrengthInput.value);
  if (!Number.isFinite(strength) || strength < 0) return;
  const sun = state.seriesIndex.sun;
  sun.on = els.sunOnInput.checked;
  sun.strength = strength;
  els.sunStrengthSlider.disabled = !sun.on;
  els.sunStrengthInput.disabled = !sun.on;
  if (state.handle) state.handle.applySun();
}

function onMetalButtonClick(metal) {
  state.metal = metal;
  updateMetalButtonStates();
  renderDialOverlay();
  populateShaderControls();
  if (!state.handle) return;
  // Re-tint in place, no rebuild.
  state.handle.applyMetal(metal);
}

function updateMetalButtonStates() {
  Array.prototype.forEach.call(els.metalButtons.children, (btn) => {
    btn.classList.toggle("is-selected", btn.dataset.metal === state.metal);
  });
}

// The selected metal's entry in "metal-shaders", the object the viewer reads
// (setMetalShaders in init); a metal without one starts from a neutral grey.
function currentShader() {
  const shaders = state.seriesIndex["metal-shaders"];
  if (!shaders[state.metal]) shaders[state.metal] = { color: [128, 128, 128], metalness: 1, roughness: 0.2 };
  return shaders[state.metal];
}

function populateShaderControls() {
  if (!state.metal) return;
  const shader = currentShader();
  els.shaderMetalLabel.textContent = state.metal;
  els.colorInput.value = rgbToHex(shader.color[0], shader.color[1], shader.color[2]);
  els.metalnessInput.value = shader.metalness;
  els.roughnessInput.value = shader.roughness;
  els.metalnessReadout.textContent = shader.metalness.toFixed(2);
  els.roughnessReadout.textContent = shader.roughness.toFixed(2);
}

function onShaderInputChange() {
  if (!state.metal) return;
  const shader = currentShader();
  const rgb = hexToRgb(els.colorInput.value);
  shader.color = [rgb.r, rgb.g, rgb.b];
  shader.metalness = parseFloat(els.metalnessInput.value);
  shader.roughness = parseFloat(els.roughnessInput.value);
  els.metalnessReadout.textContent = shader.metalness.toFixed(2);
  els.roughnessReadout.textContent = shader.roughness.toFixed(2);
  // Edited in place, so applyMetal() with the same key re-reads it.
  if (state.handle) state.handle.applyMetal(state.metal);
}

function rgbToHex(r, g, b) {
  return "#" + [r, g, b].map((n) => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, "0")).join("");
}
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

function teardown(handle) {
  if (handle && handle.dispose) handle.dispose();
}

async function rebuildViewer() {
  const token = ++state.buildToken;
  const sel = currentModelSelection();
  const previousMode = state.mode;
  state.mode = sel.mode;
  state.seriesSlug = sel.seriesSlug || null;
  state.product = sel.product || null;
  if (sel.mode === "swatch" && !state.swatchCamera) state.swatchCamera = savedSwatchCamera();
  if (sel.mode === "swatch" && state.swatchBlur === null) state.swatchBlur = savedSwatchBlur();
  // The HDRI select follows the mode on a mode change: the swatch's, or the series'.
  const hdris = state.seriesIndex.hdris || {};
  if (sel.mode !== previousMode) {
    const seriesEntry = sel.mode === "product" ? findSeries(sel.seriesSlug) : null;
    const wanted = sel.mode === "swatch" ? state.seriesIndex["swatch-hdri"] : seriesEntry && seriesEntry.hdri;
    if (wanted && hdris[wanted]) els.hdriSelect.value = wanted;
  }
  if (!state.metal) {
    state.metal = (sel.mode === "product" && sel.product["default-metal"]) || state.seriesIndex.metals[0];
  }

  setControlsDisabled(true);
  teardown(state.handle);
  state.handle = null;
  state.lastOrbit = null;
  els.viewerContainer.innerHTML = "";
  els.statusMessage.textContent = "";
  const swatch = sel.mode === "swatch";
  els.viewerContainer.classList.toggle("is-swatch", swatch);
  // The swatch's zoom is solved.
  els.zoomRow.hidden = swatch;
  els.blurRow.hidden = !swatch;
  els.dialOverlayRow.hidden = !swatch;
  if (swatch) {
    fillSwatchCameraInputs();
    els.blurInput.value = state.swatchBlur;
    els.blurSlider.value = state.swatchBlur;
    els.statusMessage.textContent =
      "Swatch scene: one sphere under the HDRI. The metal buttons change the sphere's metal, as each swatch render does; " +
      "the frame is the whole sphere, its outline touching the edges, exactly what is saved as the swatch. " +
      "Set the HDRI, its extra blur (a gaussian in pixels of the HDRI image, on top of Blur) and the camera's rotation, tilt and roll round the sphere; the rest is solved. " +
      "The dial overlay leaves clear what the material dial shows of the metal: the middle (the closed button) and its section, the dashed ring where the section starts fading out.";
  }

  const hdriKey = els.hdriSelect.value;
  const hdriPath = (state.seriesIndex.hdris || {})[hdriKey];

  let handle;
  if (sel.mode === "product") {
    if (!sel.product.assets || !sel.product.assets.model) {
      els.viewerContainer.textContent = "No 3D model for this product — nothing to orbit.";
      setCameraControlsEnabled(false);
      setControlsDisabled(false);
      updateMetalButtonStates();
      populateShaderControls();
      return;
    }
    setCameraControlsEnabled(true);
    handle = window.EmjiveModelViewer(sel.product, state.metal, {
      freeOrbit: true,
      hdri: hdriPath,
      onReady: () => { if (token === state.buildToken) setControlsDisabled(false); }
    });
  } else {
    setCameraControlsEnabled(true);
    const stubProduct = {
      name: "swatch",
      "3d-viewer-camera-default": window.EmjiveModelViewer.swatchOrbit(state.swatchCamera)
    };
    handle = window.EmjiveModelViewer(stubProduct, state.metal, {
      freeOrbit: true,
      hdri: hdriPath,
      environmentBlur: state.swatchBlur,
      swatch: true,
      onReady: () => { if (token === state.buildToken) setControlsDisabled(false); }
    });
  }

  if (!handle) {
    els.statusMessage.textContent = "Could not create a WebGL context.";
    setControlsDisabled(false);
    return;
  }
  state.handle = handle;
  els.viewerContainer.appendChild(handle.el);
  updateMetalButtonStates();
  populateShaderControls();
  renderDialOverlay();
}

// The material dial over the swatch frame, which is its disc: the selected
// metal's middle and section clear (js/option-dial.js: the sections round
// from the top in "metals" order, the middle EmjiveOptionDial.fillInner of
// the radius), the rest veiled, and a dashed ring where the edge fade starts.
// As .product-dial--fill .product-dial__sections's mask in css/style.css.
const DIAL_FADE_FROM = 0.8;
function renderDialOverlay() {
  const old = els.viewerContainer.querySelector(".dial-overlay");
  if (old) old.remove();
  if (state.mode !== "swatch" || !els.dialOverlayInput.checked) return;
  const metals = state.seriesIndex.metals || [];
  const half = Math.PI / Math.max(2, metals.length);
  const mid = Math.max(0, metals.indexOf(state.metal)) * 2 * half;
  const inner = window.EmjiveOptionDial.fillInner;
  const at = (r, a) => (r * Math.sin(a)).toFixed(4) + " " + (-r * Math.cos(a)).toFixed(4);
  const shape = "M" + at(1, mid - half) + " A1 1 0 0 1 " + at(1, mid + half) +
    " L" + at(inner, mid + half) + " A" + inner + " " + inner + " 0 1 1 " + at(inner, mid - half) + " Z";
  const line = 'fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="1" vector-effect="non-scaling-stroke"';
  els.viewerContainer.insertAdjacentHTML("beforeend",
    '<svg class="dial-overlay" viewBox="-1 -1 2 2" aria-hidden="true">' +
    '<path d="M-1 -1 H1 V1 H-1 Z ' + shape + '" fill-rule="evenodd" fill="rgba(248, 248, 248, 0.8)"/>' +
    '<path d="' + shape + '" ' + line + "/>" +
    '<circle r="' + DIAL_FADE_FROM + '" ' + line + ' stroke-dasharray="4 4"/>' +
    "</svg>");
}

function setControlsDisabled(disabled) {
  els.hdriSelect.disabled = disabled;
  els.modelSelect.disabled = disabled;
  Array.prototype.forEach.call(els.metalButtons.children, (btn) => { btn.disabled = disabled; });
}

function setCameraControlsEnabled(enabled) {
  els.rotationInput.disabled = !enabled;
  els.tiltInput.disabled = !enabled;
  els.zoomInput.disabled = !enabled;
  els.rollInput.disabled = !enabled;
  els.rotationSlider.disabled = !enabled;
  els.tiltSlider.disabled = !enabled;
  els.rollSlider.disabled = !enabled;
  els.resetCameraBtn.disabled = !enabled;
  els.saveCamera.disabled = !enabled;
  if (!enabled) els.saveCamera.checked = false;
}

// {rotation, tilt, zoom, roll} read back from the live camera: the inverse of frameCamera().
function readCurrentOrbit(handle) {
  const target = handle.target;
  const camera = handle.camera;
  if (!target || !camera) return null;
  const offset = camera.position.clone().sub(target);
  const radius = offset.length();
  if (radius < 1e-6) return null;
  const eyeDir = offset.clone().normalize();
  const phiRad = Math.acos(THREE.MathUtils.clamp(offset.y / radius, -1, 1));
  const thetaRad = Math.atan2(offset.x, offset.z);

  // Roll: the signed angle about eyeDir from the level up (WORLD_UP's component
  // perpendicular to eyeDir) to the camera's up, inverting frameCamera(). 0 at the poles.
  const levelUp = WORLD_UP.clone().addScaledVector(eyeDir, -WORLD_UP.dot(eyeDir));
  let rollRad = 0;
  if (levelUp.lengthSq() > 1e-8) {
    levelUp.normalize();
    const actualUp = camera.up.clone().addScaledVector(eyeDir, -camera.up.dot(eyeDir));
    if (actualUp.lengthSq() > 1e-8) {
      actualUp.normalize();
      const cosRoll = THREE.MathUtils.clamp(levelUp.dot(actualUp), -1, 1);
      const sinRoll = levelUp.clone().cross(actualUp).dot(eyeDir);
      rollRad = Math.atan2(sinRoll, cosRoll);
    }
  }

  const box = new THREE.Box3().setFromObject(handle.scene);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  if (!(sphere.radius > 0)) return null;
  const fovRad = (camera.fov * Math.PI) / 180;
  const refDistance = sphere.radius / Math.sin(fovRad / 2);
  const zoom = (100 * radius) / refDistance;
  return {
    rotation: Math.round((thetaRad * 180) / Math.PI),
    tilt: Math.round((phiRad * 180) / Math.PI),
    zoom: Math.round(zoom),
    roll: Math.round((rollRad * 180) / Math.PI)
  };
}

function readoutLoop() {
  requestAnimationFrame(readoutLoop);
  // The swatch camera comes from the fields: nothing to read back.
  if (!state.handle || state.mode === "swatch") return;
  const orbit = readCurrentOrbit(state.handle);
  if (!orbit) return;
  state.lastOrbit = orbit;
  // Skip the field being typed into.
  if (document.activeElement !== els.rotationInput) els.rotationInput.value = orbit.rotation;
  if (document.activeElement !== els.tiltInput) els.tiltInput.value = orbit.tilt;
  if (document.activeElement !== els.zoomInput) els.zoomInput.value = orbit.zoom;
  if (document.activeElement !== els.rollInput) els.rollInput.value = orbit.roll;
  syncSliders();
}

// On a field commit or slider move: jump the camera to the fields' values
// (handle.setCameraOrbit). The swatch takes three, through swatchOrbit().
function onOrbitInputChange() {
  if (!state.handle) return;
  const rotation = parseFloat(els.rotationInput.value);
  const tilt = parseFloat(els.tiltInput.value);
  const roll = parseFloat(els.rollInput.value);
  if (state.mode === "swatch") {
    if (![rotation, tilt, roll].every(Number.isFinite)) return;
    state.swatchCamera = { rotation, tilt, roll };
    syncSliders();
    state.handle.setCameraOrbit(window.EmjiveModelViewer.swatchOrbit(state.swatchCamera));
    return;
  }
  const zoom = parseFloat(els.zoomInput.value);
  if (![rotation, tilt, zoom, roll].every(Number.isFinite)) return;
  syncSliders();
  state.handle.setCameraOrbit({ rotation, tilt, zoom, roll });
}

function onResetCamera() {
  if (!state.handle) return;
  if (state.mode === "swatch") {
    state.swatchCamera = savedSwatchCamera();
    fillSwatchCameraInputs();
    state.handle.setCameraOrbit(window.EmjiveModelViewer.swatchOrbit(state.swatchCamera));
    return;
  }
  state.handle.setCameraOrbit(state.product["3d-viewer-camera-default"] || { rotation: 0, tilt: 75, zoom: 105 });
}

async function onSaveClick() {
  const results = [];

  async function attempt(label, url, body) {
    try {
      const data = await requestJson(url, body);
      results.push({ label, ok: true, detail: data });
    } catch (err) {
      results.push({ label, ok: false, detail: err.message });
    }
  }

  if (state.mode === "product") {
    if (els.saveCamera.checked && state.lastOrbit) {
      await attempt("Camera angle", "/api/save-product-camera", {
        seriesSlug: state.seriesSlug,
        productId: state.product.id,
        rotation: state.lastOrbit.rotation,
        tilt: state.lastOrbit.tilt,
        zoom: state.lastOrbit.zoom,
        roll: state.lastOrbit.roll
      });
    }
    if (els.saveHdri.checked) {
      await attempt("HDRI", "/api/save-series-hdri", {
        seriesSlug: state.seriesSlug,
        hdriKey: els.hdriSelect.value
      });
    }
  } else {
    if (els.saveCamera.checked) {
      await attempt("Swatch camera", "/api/save-swatch-camera", state.swatchCamera);
      // So "Reset to saved default" means what was just saved.
      if (results[results.length - 1].ok) state.seriesIndex["swatch-camera"] = { ...state.swatchCamera };
    }
    if (els.saveHdri.checked) {
      await attempt("Swatch HDRI", "/api/save-swatch-hdri", { hdriKey: els.hdriSelect.value });
      if (results[results.length - 1].ok) state.seriesIndex["swatch-hdri"] = els.hdriSelect.value;
      await attempt("Swatch HDRI blur", "/api/save-swatch-blur", { blur: state.swatchBlur });
      if (results[results.length - 1].ok) state.seriesIndex["swatch-blur"] = state.swatchBlur;
    }
  }

  if (els.saveHdriBlur.checked) {
    const deg = parseFloat(els.hdriBlurInput.value);
    await attempt("Blur", "/api/save-hdri-blur", { blur: deg });
    if (results[results.length - 1].ok) state.seriesIndex["hdri-blur"] = deg;
  }

  if (els.saveDetail.checked) {
    const levels = parseFloat(els.detailInput.value);
    await attempt("Reflection detail", "/api/save-reflection-detail", { levels });
    if (results[results.length - 1].ok) state.seriesIndex["reflection-detail"] = levels;
  }

  if (els.saveSun.checked) {
    const sun = state.seriesIndex.sun;
    await attempt("Sun", "/api/save-sun", { on: sun.on, strength: sun.strength });
  }

  if (els.saveShader.checked) {
    const rgb = hexToRgb(els.colorInput.value);
    await attempt("Metal shader (" + state.metal + ")", "/api/save-metal-shader", {
      metalKey: state.metal,
      color: [rgb.r, rgb.g, rgb.b],
      metalness: parseFloat(els.metalnessInput.value),
      roughness: parseFloat(els.roughnessInput.value)
    });
  }

  renderSaveResults(results);
}

function renderSaveResults(results) {
  els.saveResults.innerHTML = "";
  if (!results.length) {
    els.saveResults.textContent = "Nothing ticked — check a box above first.";
    return;
  }
  results.forEach((r) => {
    const line = document.createElement("div");
    line.className = "save-result " + (r.ok ? "save-result--ok" : "save-result--fail");
    line.textContent = (r.ok ? "✓ " : "✗ ") + r.label + (r.ok ? "" : " — " + r.detail);
    els.saveResults.appendChild(line);
  });
}

function onCopyJsonClick() {
  if (state.mode === "product" && !state.lastOrbit) return;
  const snippet = state.mode === "product"
    ? JSON.stringify({ "3d-viewer-camera-default": state.lastOrbit }, null, 2)
    : JSON.stringify({ "swatch-hdri": els.hdriSelect.value, "swatch-blur": state.swatchBlur, "swatch-camera": state.swatchCamera }, null, 2);
  navigator.clipboard.writeText(snippet).catch(() => {});
}
</script>
