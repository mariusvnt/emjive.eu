name: Deploy to OVH (SFTP)

# Builds the site and makes www/ on the OVH hosting an exact mirror of dist/
# over SFTP, on every push to main. See the "Deploying" section in README.md
# for the one-time secrets setup this needs.
#
# Run it by hand from the Actions tab with "dry_run" ticked to see what it
# would upload and delete without touching the server.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be uploaded and deleted, but change nothing on the server
        type: boolean
        default: false

permissions:
  contents: read

# Two overlapping uploads to the same folder can leave a half-mixed site, so
# a newer push waits for the running deploy instead of racing it.
concurrency:
  group: ovh-sftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload dist/ to OVH
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          # The server's SSH host keys, pinned so the password is only ever
          # sent to the real OVH server. Scanned with
          #   ssh-keyscan -p 22 -t rsa,ecdsa,ed25519 <FTP_SERVER>
          # If OVH ever rotates them, the deploy stops with "Host key
          # verification failed" — re-scan and replace these two lines.
          SFTP_HOST_KEYS: |
            ssh-rsa 
            ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPHzGPnvg+XUpaMELjQ4AIj/6pkjvvHYCUxDVpcdaC8T
        run: |
          # mirror --delete removes everything in www/ that isn't in dist/, so
          # never run it against an empty or failed build.
          test -f dist/index.html || { echo "dist/index.html is missing; refusing to mirror"; exit 1; }

          # Pinned host keys go in a known_hosts file under the real hostname;
          # ssh below refuses to connect to anything that doesn't match.
          known_hosts="$RUNNER_TEMP/known_hosts"
          : > "$known_hosts"
          while read -r key; do
            [ -n "$key" ] && printf '%s %s\n' "$SFTP_HOST" "$key" >> "$known_hosts"
          done <<< "$SFTP_HOST_KEYS"

          # lftp parses its script, so a backslash or double quote in the
          # password has to be escaped before it goes inside "...".
          pass=$(printf '%s' "$SFTP_PASS" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')

          # The contents of dist/ land directly in www/, so index.html sits at
          # its root. --delete then removes whatever else is in www/, after
          # the new files are up, so the site is never missing pages mid-deploy.
          lftp <<EOF
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          set sftp:auto-confirm no
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts -o GlobalKnownHostsFile=/dev/null"
          open -p 22 -u "$SFTP_USER","$pass" sftp://$SFTP_HOST
          mirror --reverse --delete --verbose --no-perms $DRY_RUN ./dist www
          bye
          EOF
