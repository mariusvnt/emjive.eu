name: Deploy to OVH (SFTP)

# Builds the site and uploads dist/ to the OVH hosting over SFTP on every
# push to main. See the "Deploying" section in README.md for the one-time
# secrets setup this needs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two overlapping uploads to the same folder can leave a half-mixed site, so
# a newer push waits for the running deploy instead of racing it.
concurrency:
  group: ovh-sftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload dist/ to OVH
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          # lftp parses its script, so a backslash or double quote in the
          # password has to be escaped before it goes inside "...".
          pass=$(printf '%s' "$SFTP_PASS" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
          # The contents of dist/ land directly in www/, so index.html sits
          # at its root. Files already in www/ that the build doesn't produce
          # (an .htaccess, say) are left alone.
          lftp <<EOF
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          set sftp:auto-confirm yes
          open -p 22 -u "$SFTP_USER","$pass" sftp://$SFTP_HOST
          mirror --reverse --verbose --no-perms ./dist www
          bye
          EOF
