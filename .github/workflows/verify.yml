name: Verify

# The gate for every change: lint, data schema, production build, built-output
# checks, runtime dependency audit. Runs on pull requests and is called by
# deploy.yml, which ships this job's dist/ artifact as-is.
#
# Locally: npm run verify (then npm audit --omit=dev)

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      # Runtime dependencies only: devDependencies never reach the site.
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          # Otherwise dotfiles are dropped, including dist/.htaccess.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
