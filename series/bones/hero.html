<!-- Bones hero, cloned into index.html by js/series.js: each
     <template data-series-slot="id"> fills the element with that id.
     Paths resolve against the page, not this file. Behaviour is in hero.js. -->

<template data-series-slot="seriesHero">
  <section class="reveal" id="revealSection">
    <div class="reveal__pin">
      <div class="reveal__stage">
        <!-- LCP image. No src: js/series.js picks the desktop/phone, low/high-res
             version when cloning (data-full is the base name, data-lo marks a low-res
             pair). fetchpriority="high" so it outranks the grid's queued icons. -->
        <img class="reveal__img reveal__img--normal" data-full="assets/series/bones/hero/hand-rings-under-flesh_3k.webp" data-lo data-first-paint="play" width="2880" height="1620" fetchpriority="high" decoding="async" alt="" />
        <div class="reveal__xray-group" id="revealXrayGroup">
          <!-- Hidden until scroll, hence low priority. No low-res version: on a phone
               it must crop exactly like the picture it overlays. First paint when the
               hero is skipped (data-hero="skip"). -->
          <img class="reveal__img--xray" data-full="assets/series/bones/hero/hand_xray.webp" data-first-paint="skip" width="1920" height="1080" fetchpriority="low" decoding="async" alt="" />
          <!-- The arm below the hand, in view when the wheel pulls the camera back.
               Not lazy: the pin's overflow clip would hold it back until in view. -->
          <img class="reveal__xray-extension reveal__xray-extension--1" data-full="assets/series/bones/hero/hand_xray_extension_1.webp" data-first-paint="skip" width="3840" height="2160" fetchpriority="low" decoding="async" alt="" />
          <img class="reveal__xray-extension reveal__xray-extension--2" data-full="assets/series/bones/hero/hand_xray_extension_2.webp" data-first-paint="skip" width="3840" height="2160" fetchpriority="low" decoding="async" alt="" />
          <!-- hero.js inserts one .reveal__ring per product with hero-hand-visibility.visible. -->
        </div>
      </div>
      <div class="reveal__frontier" id="revealFrontier"></div>
    </div>
    <!-- As tall as the entrance stretch (--reveal-entrance-vh), measured in px by hero.js. -->
    <div class="reveal__entrance" aria-hidden="true"></div>
  </section>
</template>

<!-- The x-ray arm behind the product grid: a separate slot, as it must sit inside .products. -->
<template data-series-slot="seriesBackdrop">
  <div class="reveal__extension-crop">
    <!-- Lazy: two screens down. -->
    <img class="reveal__extension reveal__extension--1" data-full="assets/series/bones/hero/hand_xray_extension_1.webp" width="3840" height="2160" loading="lazy" decoding="async" alt="" />
    <img class="reveal__extension reveal__extension--2" data-full="assets/series/bones/hero/hand_xray_extension_2.webp" width="3840" height="2160" loading="lazy" decoding="async" alt="" />
  </div>
</template>
