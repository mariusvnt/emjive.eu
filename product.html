<!doctype html>
<html lang="en" data-page-loader data-products="eager">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f8f8f8" />
<title>Product — em·ji·ve</title>
<meta name="description" content="Item detail" />
<link rel="icon" type="image/svg+xml" href="assets/logo_compact.svg" />
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="em·ji·ve" />
<meta property="og:title" content="Product — em·ji·ve" />
<meta property="og:description" content="Item detail" />
<meta property="og:url" content="https://emjive.eu/product.html" />
<meta property="og:image" content="https://emjive.eu/assets/series/bones/products/marrow_ring/marrow_icon_steel.webp" />
<meta property="og:image:width" content="512" />
<meta property="og:image:height" content="512" />
<meta property="og:image:alt" content="em&middot;ji&middot;ve — Marrow ring in steel" />
<meta property="og:locale" content="en" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Product — em·ji·ve" />
<meta name="twitter:description" content="Item detail" />
<meta name="twitter:image" content="https://emjive.eu/assets/series/bones/products/marrow_ring/marrow_icon_steel.webp" />

<!-- Both typefaces are self-hosted (see the @font-face blocks in
     css/style.css) — this used to be a render-blocking Google Fonts
     stylesheet on a third-party origin. Preloaded rather than left for the
     CSS parser to discover: a webfont is otherwise found only once
     style.css has downloaded AND parsed, which puts it a full round trip
     behind everything else in the head.
     crossorigin is mandatory on a font preload even same-origin — fonts
     are always fetched in CORS mode, and a preload whose mode doesn't
     match the real request is simply downloaded twice. -->
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/geist-mono-woff2/GeistMono-latin.woff2" crossorigin />
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/dinish-woff2/DINish-Regular.woff2" crossorigin />

<!-- data/series.json gates EVERYTHING on every page: which series is
     shown, its products, and (on the homepage) the hero bundle, which
     can't even start until this resolves. js/series.js below fetches it,
     but only once the browser has downloaded and executed that script —
     so without this the request sits a round trip behind where it could.
     The preload scanner sees this while still parsing the head and starts
     it in parallel with series.js itself. -->
<link rel="preload" as="fetch" href="data/series.json" crossorigin />

<link rel="stylesheet" href="css/style.css" />

<!-- Loader (see js/loader.js). Blocking, and ahead of series.js: pages that
     wait on something opt into an arrival loader with data-page-loader on
     <html>, and that cover has to be up before <body> is parsed; every
     page's scripts also use window.EmjiveLoader for their own assets. -->
<script src="js/loader.js"></script>

<!-- Series resolution (which series this page shows, and its data).
     Blocking on purpose — see the header comment in js/series.js. -->
<script src="js/series.js"></script>

<!-- Lazy 3D viewer loader (see js/viewer-entry.js). No data-viewer on <html>
     here on purpose: the three.js chunk (and the HDRI and model) are the
     heaviest things on the page and none of them is part of its first
     paint, so js/product.js asks for them only once the images that are
     (the x-ray backdrop and the model's poster) have arrived. -->
<script type="module" src="js/viewer-entry.js"></script>
</head>
<body>
<a class="skip-link" href="#productDetail">Skip to content</a>


<header class="site-header">
  <div class="site-header__row">
    <a class="site-header__brand" href="index.html#top">
      <img src="assets/logo.svg" width="512" height="192" alt="em&middot;ji&middot;ve" />
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false" aria-controls="siteHeaderMenu">
      <span class="menu-toggle__bar menu-toggle__bar--h"></span>
      <span class="menu-toggle__bar menu-toggle__bar--v"></span>
    </button>
  </div>
  <div class="site-header__menu" id="siteHeaderMenu">
    <div class="site-header__menu-inner">
      <nav class="site-header__nav" aria-label="Site">
        <!-- Filter row: the buttons are rendered by js/main.js from the
             ACTIVE series' own category list (data/series.json) — don't
             hand-write them, and don't assume three: each series declares
             its own subset of the global vocabulary. On every page but
             the grid this becomes a plain "Gallery" link instead — see
             js/main.js's renderHeaderFilter(). -->
        <div class="site-header__filter" id="siteHeaderFilter">
          <span class="site-header__filter-label">Filter gallery by</span>
          <span class="site-header__filter-options" id="headerFilterOptions"></span>
        </div>
        <a href="archives.html" class="is-info">Archives</a>
        <a href="creation-process.html" class="is-info">Creation process</a>
      </nav>
    </div>
  </div>
</header>

<main class="product-detail" id="productDetail" tabindex="-1">
<noscript>
  <div class="page-shell">
    <p class="page-shell__loading">This page needs JavaScript to load its content.</p>
  </div>
</noscript>

  <!-- Only ever holds the not-found message now (js/product.js showNotFound);
       the wait itself is the page's arrival loader (js/loader.js). -->
  <p class="product-detail__loading" id="productDetailLoading" role="status" hidden></p>

  <div class="product-detail__content" id="productDetailContent" hidden>

    <div class="product-detail__intro">

      <!-- 1. Product label -->
      <div class="product-detail__label-bar">
        <img class="product-detail__label-thumb" id="productLabelThumb" alt="" hidden />
        <h1 class="product-detail__label-text">
          <span class="product-detail__label-name" id="productLabelName"></span><span class="product-detail__label-type" id="productLabelType"></span>
        </h1>
        <span class="product-detail__label-price" id="productLabelPrice" aria-live="polite" aria-atomic="true"></span>
      </div>

      <!-- 2. Carousel: 3D model (always slide 1) + real product photos.
           No visible arrows/outline — navigate by dragging horizontally,
           or tapping a slide to center it (see js/product.js). -->
      <div class="product-carousel-frame" id="productCarouselFrame">
        <img class="product-carousel__xray" id="productCarouselXray" alt="" fetchpriority="high" decoding="async" hidden />
        <div class="product-carousel" id="productCarousel">
          <div class="product-carousel__viewport">
            <div class="product-carousel__track" id="productCarouselTrack"></div>
          </div>
        </div>
      </div>

      <!-- 3. Metal selection: one bar per metal, built by js/metal-picker.js -->
      <div class="product-metals" id="productMetals"></div>

    </div>

    <!-- 5–7. Expandable sections (collapsed by default; js/product.js's
         wireDisclosures toggles aria-expanded on the button and .is-open on
         its panel). The "+" reuses the header toggle's bars. -->

    <!-- 5. Item description -->
    <section class="product-detail__section">
      <h2 class="disclosure__heading">
        <button class="disclosure__toggle" type="button" id="descriptionToggle" aria-expanded="false" aria-controls="descriptionPanel">
          <span class="disclosure__label">Description</span>
          <span class="disclosure__icon" aria-hidden="true">
            <span class="menu-toggle__bar menu-toggle__bar--h"></span>
            <span class="menu-toggle__bar menu-toggle__bar--v"></span>
          </span>
        </button>
      </h2>
      <div class="disclosure__panel" id="descriptionPanel" role="region" aria-labelledby="descriptionToggle">
        <div class="disclosure__inner">
          <p class="product-detail__description" id="productDescription"></p>
        </div>
      </div>
    </section>

    <!-- 6. Technical characteristics (depends on the chosen metal) -->
    <section class="product-detail__section">
      <h2 class="disclosure__heading">
        <button class="disclosure__toggle" type="button" id="specsToggle" aria-expanded="false" aria-controls="specsPanel">
          <span class="disclosure__label">Characteristics</span>
          <span class="disclosure__icon" aria-hidden="true">
            <span class="menu-toggle__bar menu-toggle__bar--h"></span>
            <span class="menu-toggle__bar menu-toggle__bar--v"></span>
          </span>
        </button>
      </h2>
      <div class="disclosure__panel" id="specsPanel" role="region" aria-labelledby="specsToggle">
        <div class="disclosure__inner">
          <dl class="product-specs" id="productSpecs"></dl>
        </div>
      </div>
    </section>

    <!-- 7. Shipping & returns (static, same on every product) -->
    <section class="product-detail__section">
      <h2 class="disclosure__heading">
        <button class="disclosure__toggle" type="button" id="shippingToggle" aria-expanded="false" aria-controls="shippingPanel">
          <span class="disclosure__label">Shipping &amp; Returns</span>
          <span class="disclosure__icon" aria-hidden="true">
            <span class="menu-toggle__bar menu-toggle__bar--h"></span>
            <span class="menu-toggle__bar menu-toggle__bar--v"></span>
          </span>
        </button>
      </h2>
      <div class="disclosure__panel" id="shippingPanel" role="region" aria-labelledby="shippingToggle">
        <div class="disclosure__inner">
          <div class="product-detail__shipping">
            <p>Each piece is cast and finished to order — please allow 2–3 weeks before dispatch.</p>
            <p>Unworn items can be returned within 14 days of delivery for a full refund.</p>
          </div>
        </div>
      </div>
    </section>

  </div>
</main>

<!-- Select / Add bar: a liquid-glass strip floating on top of the selection
     bar (css/style.css, .product-select-bar), shown by js/product.js once
     the product has rendered. It says "Select" and opens the size sheet
     below; while the sheet is up it says "Add" instead. -->
<div class="product-select-bar glass" id="productSelectBar" data-glass hidden>
  <button class="product-select-bar__button" id="selectButton" type="button"><span class="product-select-bar__label">Select</span></button>
</div>

<!-- Size-selection modal, opened by the Select bar — slides up from
     behind the floating bars as a bottom sheet resting right above the
     Select bar (see .size-modal--drawer and .size-modal--select-bar in
     css/style.css), the same component as the Modify sheet (#modifyModal,
     built by js/modify-modal.js). Confirming a size is done from the
     Select bar's own "Add" button (js/product.js), not from a button in
     here — this panel is a pure picker, and the "Size" field is the only
     way to give a size.

     role/aria-modal/aria-label sit on THIS element rather than on
     .size-modal__panel, because js/focus-trap.js traps the whole modal —
     see its header comment. tabindex="-1" is what lets the trap focus this
     element on open so the aria-label is read before the first control. -->
<div class="size-modal size-modal--drawer size-modal--select-bar" id="sizeModal" aria-hidden="true"
     role="dialog" aria-modal="true" aria-label="Choose a size" tabindex="-1">
  <div class="size-modal__backdrop" id="sizeModalBackdrop"></div>
  <!-- .size-modal__sheet carries the slide transform (see
       .size-modal--drawer .size-modal__sheet in css/style.css). The size
       guide is its own row under the size field, with the guide itself
       ahead of its toggle: it opens between the two, so the sheet grows
       upward while the button stays put right above the bar. -->
  <div class="size-modal__sheet">
    <div class="size-modal__panel">
      <div class="size-modal__content">
        <div class="size-modal__custom-row">
          <label class="size-modal__custom-label" for="sizeModalCustomInput">Size</label>
          <div class="size-modal__custom-field">
            <span class="size-modal__custom-underline">
              <input class="size-modal__custom-input" id="sizeModalCustomInput" type="text" inputmode="decimal" autocomplete="off" />
              <span class="size-modal__custom-unit" id="sizeModalCustomUnit"></span>
            </span>
          </div>
        </div>
      </div>
      <div class="size-modal__guide">
        <div class="size-modal__guide-panel" id="sizeModalGuide">
          <div class="size-modal__guide-panel-inner">
            <div class="size-modal__guide-content" id="sizeModalGuideContent"></div>
          </div>
        </div>
        <button class="size-modal__guide-toggle" id="sizeModalGuideToggle" type="button" aria-expanded="false" aria-controls="sizeModalGuide">Size guide</button>
      </div>
    </div>
  </div>
</div>

<!-- Every script below is deferred. They used to be plain parser-blocking
     scripts, which made the parser wait on each file in turn — a staggered
     chain of round trips that held product.js, the 3D module and the
     arrival loader back by about a second on a slow link. Deferred
     scripts download in parallel with the parser and run in document order
     once it is done.

     That order is the contract. js/viewer-entry.js (a module, in <head>) is
     first on the deferred queue, so window.EmjiveLoadViewer exists before
     any of these run. The helpers come before the scripts that use them:
     focus-trap.js and carousel.js (window.EmjiveFocusTrap/EmjiveCarousel)
     before product.js; carousel.js/order-rows.js/modify-modal.js are the
     Modify sheet and its parts, reachable from the bar's drawer on every
     page, and order-rows.js has to precede selection-bar.js, which builds
     its drawer rows with it at load. main.js and product.js run last, the
     same order they ran in when only those two were deferred. -->
<script src="js/focus-trap.js" defer></script>
<script src="js/selection.js" defer></script>
<script src="js/carousel.js" defer></script>
<script src="js/order-rows.js" defer></script>
<script src="js/metal-picker.js" defer></script>
<script src="js/modify-modal.js" defer></script>
<script src="js/liquid-glass.js" defer></script>
<script src="js/selection-bar.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/product.js" defer></script>
</body>
</html>
