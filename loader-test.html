<!-- Dev-only page (not built): the logo loader on an endless loop.
     /loader-test.html shows one loader per box, released by its "Finish"
     button; /loader-test.html?page shows the full-page loader. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Loader test</title>
<link rel="icon" type="image/svg+xml" href="assets/logo_compact.svg" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .test-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 2rem;
    align-items: flex-start;
    padding: 2rem var(--edge-px);
  }
  .test-cell { display: grid; gap: 0.5rem; justify-items: start; }
  .test-box {
    position: relative;
    outline: 1px dashed var(--category-col);
    display: grid;
    place-items: center;
    font-family: var(--font-secondary);
    font-size: 0.75rem;
    color: var(--category-col);
  }
  .test-box__loaded { opacity: 0; transition: opacity var(--fade-quick) ease; }
  .test-box.is-loaded .test-box__loaded { opacity: 1; }
  .test-cell button { font-family: var(--font-secondary); font-size: 0.75rem; }
</style>
</head>
<body>
<div class="test-grid" id="grid"></div>
<script src="js/helpers.js"></script>
<script src="js/loader.js"></script>
<script>
(function () {
  "use strict";
  if (location.search.indexOf("page") !== -1) {
    window.EmjiveLoader.mount(document.body, { page: true, watchdog: false });
    return;
  }
  // Container sizes used on the site.
  var sizes = [
    ["phone card", 170, 170],
    ["desktop card", 460, 460],
    ["model tile", 330, 330],
    ["modify poster (phone)", 130, 130],
    ["wide strip", 700, 160]
  ];
  var grid = document.getElementById("grid");
  sizes.forEach(function (s) {
    var cell = document.createElement("div");
    cell.className = "test-cell";
    var box = document.createElement("div");
    box.className = "test-box";
    box.style.width = s[1] + "px";
    box.style.height = s[2] + "px";
    box.innerHTML = '<span class="test-box__loaded">loaded</span>';
    var btn = document.createElement("button");
    btn.textContent = "Finish (" + s[0] + ", " + s[1] + "×" + s[2] + ")";
    var hold = window.EmjiveLoader.mount(box, { watchdog: false });
    var done = false;
    btn.addEventListener("click", function () {
      if (done) return;
      done = true;
      btn.disabled = true;
      btn.textContent = "finishing…";
      hold.done().then(function () {
        box.classList.add("is-loaded");
        btn.textContent = "finished";
      });
    });
    cell.appendChild(box);
    cell.appendChild(btn);
    grid.appendChild(cell);
  });
})();
</script>
</body>
</html>
