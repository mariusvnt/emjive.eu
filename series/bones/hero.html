<!-- Bones — hero markup, injected into index.html by js/series.js.

     One <template data-series-slot="..."> per destination slot; the loader
     clones each into the matching element id. A series can supply any
     subset of the slots (or extra ones, given a matching id in the page)
     without index.html changing.

     Image paths here (data-full, set as <img src> by js/series.js) resolve
     against the PAGE, not this file, because the elements are cloned into the
     live document — so these stay repo-root-relative, same as the paths in
     data/. (hero.css's url() would
     resolve the other way; see its header.)

     No <script> tags: behavior lives in hero.js. -->

<template data-series-slot="seriesHero">
  <section class="reveal" id="revealSection">
    <div class="reveal__pin">
      <div class="reveal__stage">
        <!-- The LCP image: fetchpriority="high" because by the time this fragment
             is cloned in, the grid's own icons are usually already queued and
             the browser has no other way to know this one outranks them.
             width/height are the file's intrinsic size (the CSS sets both
             dimensions itself) so the box is reserved before it decodes.

             NO src here, on purpose: this picture exists in four versions —
             desktop and smartphone, low and high res (the smartphone ones are
             cropped to the middle of it) — and js/series.js picks one for the
             viewport as it clones this fragment in: data-full names the
             original, which is the desktop high-res one and the base name of
             the others (_lo, _m, _m_lo); data-lo says it has the low-res
             pair too, shown first and swapped for the high-res one once the
             page is loaded and idle (EmjiveLoader in js/loader.js).
             scripts/make-image-variants.js writes the versions;
             scripts/validate-data.js checks they are there. -->
        <img class="reveal__img reveal__img--normal" data-full="assets/series/bones/hero/hand-rings-under-flesh_3k.webp" data-lo width="2880" height="1620" fetchpriority="high" decoding="async" alt="" />
        <div class="reveal__xray-group" id="revealXrayGroup">
          <!-- Clipped away entirely until the visitor scrolls (see hero.css),
               so it must not outrank the picture above: low priority. No
               low-res version (data-lo absent): on a phone it is cropped
               exactly like the picture it overlays, or the two would not
               line up. -->
          <img class="reveal__img--xray" data-full="assets/series/bones/hero/hand_xray.webp" width="1920" height="1080" fetchpriority="low" decoding="async" alt="" />
          <!-- .reveal__ring <img>s are inserted here by hero.js's
               updateHeroRings() — one per product whose
               hero-hand-visibility.visible is true in this series'
               products.json, not a fixed single element. -->
        </div>
      </div>
      <div class="reveal__frontier" id="revealFrontier"></div>
    </div>
  </section>
</template>

<!-- The x-ray hand continues below the fold, behind the product grid — a
     second slot because it has to live inside .products (which is
     position: relative and stacks the grid above it), not inside .reveal. -->
<template data-series-slot="seriesBackdrop">
  <div class="reveal__extension-crop">
    <!-- Two screens down, behind the grid: lazy (fetched as the visitor
         nears them, not alongside the hero) and decoded off the main thread
         (each is 3840x2160, ~33MB once decoded). -->
    <img class="reveal__extension reveal__extension--1" data-full="assets/series/bones/hero/hand_xray_extension_1.webp" width="3840" height="2160" loading="lazy" decoding="async" alt="" />
    <img class="reveal__extension reveal__extension--2" data-full="assets/series/bones/hero/hand_xray_extension_2.webp" width="3840" height="2160" loading="lazy" decoding="async" alt="" />
  </div>
</template>
