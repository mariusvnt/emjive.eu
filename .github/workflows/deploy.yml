name: Deploy to OVH (SFTP)

# On every push to main: runs verify.yml, then mirrors its dist/ to www/ on the
# OVH hosting over SFTP. Secrets setup: README.md, "Deploying".
# Run by hand with "dry_run" to list changes without touching the server.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be uploaded and deleted, but change nothing on the server
        type: boolean
        default: false
      prune_old_assets:
        description: Also delete the previous releases' content-hashed bundles (assets/*-<hash>.js etc.) instead of keeping them
        type: boolean
        default: false

permissions:
  contents: read

# Overlapping uploads could leave a half-mixed site.
concurrency:
  group: ovh-sftp-deploy
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # The dist/ verify built and checked, not a second build.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Upload dist/ to OVH
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          PRUNE_OLD_ASSETS: ${{ inputs.prune_old_assets && 'yes' || 'no' }}
          # Pinned so the password only goes to the real server. If OVH rotates them
          # ("Host key verification failed"), re-scan and replace:
          #   ssh-keyscan -p 22 -t rsa,ecdsa,ed25519 <FTP_SERVER>
          SFTP_HOST_KEYS: |
            ssh-rsa 
            ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPHzGPnvg+XUpaMELjQ4AIj/6pkjvvHYCUxDVpcdaC8T
        run: |
          # mirror --delete would wipe www/ for an empty or failed build.
          test -f dist/index.html || { echo "dist/index.html is missing; refusing to mirror"; exit 1; }
          # A dotfile, easily lost in the artifact; --delete would then remove the live one.
          test -f dist/.htaccess || { echo "dist/.htaccess is missing; refusing to mirror"; exit 1; }

          known_hosts="$RUNNER_TEMP/known_hosts"
          : > "$known_hosts"
          while read -r key; do
            [ -n "$key" ] && printf '%s %s\n' "$SFTP_HOST" "$key" >> "$known_hosts"
          done <<< "$SFTP_HOST_KEYS"

          # lftp parses its script: escape backslashes and double quotes.
          pass=$(printf '%s' "$SFTP_PASS" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')

          # Two passes so the site is never missing a file mid-deploy:
          #   1. upload everything, delete nothing;
          #   2. delete what dist/ lacks, except the content-hashed bundles under
          #      assets/, which tabs still holding the previous HTML need. Prune them
          #      by hand with "prune_old_assets" (e.g. monthly).
          # If the exclude regex stops matching, stale bundles are simply deleted; check
          # with a dry run.
          hashed='^assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css|woff2|svg|webp)$'
          if [ "$PRUNE_OLD_ASSETS" = "yes" ]; then
            hashed='^$'
          fi

          lftp <<EOF
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          set sftp:auto-confirm no
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts -o GlobalKnownHostsFile=/dev/null"
          open -p 22 -u "$SFTP_USER","$pass" sftp://$SFTP_HOST
          mirror --reverse --verbose --no-perms $DRY_RUN ./dist www
          mirror --reverse --delete --verbose --no-perms --exclude '$hashed' $DRY_RUN ./dist www
          bye
          EOF
