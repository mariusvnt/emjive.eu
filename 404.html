<!doctype html>
<!-- The not-found page (public/.htaccess ErrorDocument). No scripts: the site's classic scripts are linked relatively and would 404 at depth. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f8f8f8" />
<meta name="robots" content="noindex" />
<title>Page not found — em·ji·ve</title>
<link rel="icon" type="image/svg+xml" href="assets/logo_compact.svg" />

<!-- Served at any missing path, however deep (ErrorDocument in public/.htaccess),
     so nothing may be relative: Vite makes the assets above absolute, but the
     unbundled js/*.js can't be, hence no scripts and the absolute "/" links. -->
<link rel="stylesheet" href="css/style.css" />
</head>
<body id="top">

<header class="site-header">
  <div class="site-header__row">
    <a class="site-header__brand" href="/">
      <img src="assets/logo.svg" width="512" height="192" alt="em&middot;ji&middot;ve" />
    </a>
  </div>
</header>

<main class="page-message page-message--screen" id="main">
  <h1 class="page-message__text">Not all those who wander are lost, but you appear to be. This url doesn't exist.</h1>
  <a class="page-message__button" href="/">Back to the gallery</a>
</main>

</body>
</html>
