name: Verify

# The gate for every change: lint, data schema, production build, built-output
# checks, runtime dependency audit. Runs on pull requests and is called by
# deploy.yml, which ships this job's dist/ artifact as-is.
#
# Locally: npm run verify (then npm audit --omit=dev)

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      # Runtime dependencies only: devDependencies never reach the site.
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          # Otherwise dotfiles are dropped, including dist/.htaccess.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
