<!doctype html>
<!-- The homepage (/gallery): the featured series' hero, then its gallery as the wheel or the grid. -->
<html lang="en" data-page-loader data-viewer="idle" data-products="eager">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f8f8f8" />
<title>em·ji·ve</title>
<meta name="description" content="Gallery of 3d-engineered items" />
<link rel="canonical" href="https://emjive.eu/gallery" />
<link rel="icon" type="image/svg+xml" href="assets/logo_compact.svg" />
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="em·ji·ve" />
<meta property="og:title" content="em·ji·ve" />
<meta property="og:description" content="Gallery of 3d-engineered items" />
<meta property="og:url" content="https://emjive.eu/gallery" />
<meta property="og:image" content="https://emjive.eu/preview.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="em&middot;ji&middot;ve" />
<meta property="og:locale" content="en" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="em·ji·ve" />
<meta name="twitter:description" content="Gallery of 3d-engineered items" />
<meta name="twitter:image" content="https://emjive.eu/preview.jpg" />

<!-- crossorigin is required even same-origin, or the font is fetched twice. -->
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/geist-mono-woff2/GeistMono-latin.woff2" crossorigin />
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/dinish-woff2/DINish-Regular.woff2" crossorigin />

<!-- Every page waits on data/series.json; preloading starts it in parallel with series.js. -->
<link rel="preload" as="fetch" href="data/series.json" crossorigin />

<link rel="stylesheet" href="css/style.css" />

<!-- First: the helpers every script uses (window.EmjiveHelpers). -->
<script src="js/helpers.js"></script>

<!-- Blocking: reserves the previous document height before
     <body> parses, so the saved scroll offset is reachable on first paint.
     After the stylesheet, whose .emjive-restoring-scroll rules it needs. -->
<script src="js/scroll-memory.js"></script>

<!-- Blocking: the arrival cover (data-page-loader) must be up before <body> parses. -->
<script src="js/loader.js"></script>

<!-- Blocking on purpose; see js/series.js. -->
<script src="js/series.js"></script>

<!-- Lazy 3D viewer: three.js loads when idle (data-viewer="idle") or when a model is first needed. -->
<script type="module" src="js/viewer-entry.js"></script>
</head>
<!-- Static, so the selection bar is hidden from first paint, before the hero arrives. -->
<body id="top" class="has-series-hero">
<a class="skip-link" href="#main">Skip to content</a>


<header class="site-header">
  <div class="site-header__row">
    <!-- #top, not /gallery#top as on the other pages: reached at /, that would load the page again instead of scrolling. -->
    <a class="site-header__brand" href="#top">
      <img src="assets/logo.svg" width="512" height="192" alt="em&middot;ji&middot;ve" />
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false" aria-controls="siteHeaderMenu">
      <span class="menu-toggle__bar menu-toggle__bar--h"></span>
      <span class="menu-toggle__bar menu-toggle__bar--v"></span>
    </button>
  </div>
  <div class="site-header__menu" id="siteHeaderMenu">
    <div class="site-header__menu-inner">
      <nav class="site-header__nav" aria-label="Site">
        <!-- Filled by js/main.js from the active series' categories. -->
        <div class="site-header__filter" id="siteHeaderFilter">
          <span class="site-header__filter-label">Filter gallery by</span>
          <span class="site-header__filter-options" id="headerFilterOptions"></span>
        </div>
        <a href="/archives" class="is-info">Archives</a>
        <a href="/creation-process" class="is-info">Creation process</a>
      </nav>
    </div>
    <!-- Header blur and chromatic aberration (.site-header__veil). -->
    <span class="site-header__veil" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </span>
  </div>
</header>

<main id="main" tabindex="-1">
<noscript>
  <div class="page-message page-message--screen">
    <p class="page-message__text">This page needs JavaScript to load its content.</p>
  </div>
</noscript>

  <!-- Visually hidden: the design has no room for a title. -->
  <h1 class="visually-hidden">em&middot;ji&middot;ve — digital gallery of innovative jewelry</h1>

  <!-- The featured series' hero (series/<slug>/hero.*), injected by js/series.js. -->
  <div class="series-hero" id="seriesHero"></div>

  <section class="products" id="products">
    <!-- Wheel/grid toggle ("stack"/"grid" in code). Both icons and labels are in
         the markup; data-gallery-view on <html> shows one, so nothing swaps. -->
    <button class="gallery-control gallery-control--view" id="galleryViewToggle" type="button" aria-label="switch to grid">
      <svg class="gallery-control__icon gallery-control__icon--grid" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="6.5" height="6.5"/><rect x="13.5" y="4" width="6.5" height="6.5"/><rect x="4" y="13.5" width="6.5" height="6.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5"/></g></svg>
      <svg class="gallery-control__icon gallery-control__icon--wheel" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
      <span class="gallery-control__label gallery-control__label--grid">grid</span>
      <span class="gallery-control__label gallery-control__label--stack">wheel</span>
    </button>

    <!-- The material picker, built by js/gallery.js, at the gallery's top left in both views. -->
    <div class="gallery-material" id="galleryMaterial"></div>

    <!-- Second hero slot, behind the grid. -->
    <div class="series-hero-backdrop" id="seriesBackdrop"></div>

    <!-- The wheel, built by js/gallery-stack.js. -->
    <div class="gallery-stage" id="galleryStage"></div>

    <div class="product-grid" id="productGrid">
      <!-- Grid items, rendered by js/gallery.js over the static ones the build writes here (emitGalleryContent in vite.config.js). -->
    </div>
  </section>


</main>

<!-- Deferred, run in document order after the viewer-entry.js module (so
     window.EmjiveLoadViewer exists). order-rows.js must precede
     selection-bar.js; gallery-stack.js must precede gallery.js. -->
<script src="js/focus-trap.js" defer></script>
<script src="js/selection.js" defer></script>
<script src="js/order-rows.js" defer></script>
<script src="js/option-dial.js" defer></script>
<script src="js/size-finder.js" defer></script>
<script src="js/modify-modal.js" defer></script>
<script src="js/selection-bar.js" defer></script>
<script src="js/gallery-stack.js" defer></script>
<script src="js/gallery.js" defer></script>
<script src="js/main.js" defer></script>
</body>
</html>
